name: Kontrol

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx supabase start -x studio,postgres-meta
      - run: npm run db:env
      - run: npm run db:test
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
