<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliş Bebe sayfa taslakları</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--petrol:#17454f;--hardal:#f4b942;--nar:#b93a4b;--nane:#cfe8e1;--zemin:#f4f9f8;--gri:#55686d;--cizgi:#d5e2e0}
*{box-sizing:border-box}
body{margin:0;background:#e4eeec;color:var(--petrol);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:"Baloo 2",Figtree,sans-serif;line-height:1.2;margin:0}
.ust{padding:32px 20px 8px;max-width:1240px;margin:auto}
.ust p{max-width:65ch;color:var(--gri);margin:8px 0 0}
.grup{max-width:1240px;margin:auto;padding:24px 20px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
figure{margin:0;width:340px;max-width:100%}
figure.genis{width:100%}
figcaption{font-weight:600;margin-bottom:8px}
.ekran{background:var(--zemin);border-radius:20px;overflow:hidden;border:1px solid var(--cizgi)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#fff}
.logo{font-size:22px;font-weight:700}
.ic{padding:16px;display:grid;gap:14px;min-width:0}
.kahraman{background:var(--nane);padding:26px 16px 0;text-align:center}
.kahraman h2{font-size:30px;margin-bottom:14px}
.kahraman svg{display:block;width:100%;margin-top:18px}
.dugme{display:inline-block;background:var(--hardal);color:var(--petrol);padding:12px 22px;border-radius:999px;font-weight:600}
.dugme.bos{background:#fff;border:2px solid var(--petrol);padding:10px 18px}
.dugme.tam{width:100%;text-align:center}
.ara{background:#fff;border:1px solid var(--cizgi);border-radius:999px;padding:10px 16px;color:var(--gri)}
.izgara{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foto{aspect-ratio:4/5;border-radius:14px;display:grid;place-items:center;background:var(--nane)}
.foto.b{background:#f7e3b5}.foto.c{background:#f0d5d8}.foto.d{background:#fff}
.foto svg{width:58%}
.ad{font-size:14px;margin-top:6px}
.fiyat{font-weight:600}.eski{color:var(--gri);text-decoration:line-through;font-weight:400;font-size:14px}
.cip{display:inline-block;padding:7px 13px;border-radius:999px;border:1.5px solid var(--cizgi);background:#fff;font-size:14px;margin:0 4px 6px 0}
.cip.sec{background:var(--petrol);color:#fff;border-color:var(--petrol)}
.cip.yok{color:var(--gri);text-decoration:line-through;background:var(--zemin)}
.renk{display:inline-block;width:32px;height:32px;border-radius:50%;margin-right:8px;border:2px solid #fff;outline:1.5px solid var(--cizgi)}
.renk.sec{outline:3px solid var(--petrol)}
.satir{display:flex;justify-content:space-between;gap:12px}
.alan{background:#fff;border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px}
.alan small{display:block;color:var(--gri)}
.secenek{background:#fff;border:1.5px solid var(--cizgi);border-radius:12px;padding:12px}
.secenek.sec{border:2.5px solid var(--petrol)}
.panel{display:grid;grid-template-columns:200px minmax(0,1fr)}
.menu{background:var(--petrol);color:#fff;padding:20px;display:grid;gap:10px;align-content:start;font-size:15px}
.menu b{color:var(--hardal)}
.tablo{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;font-size:14px;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--cizgi)}
td.s,th.s{text-align:right;font-variant-numeric:tabular-nums}
.etiket{padding:3px 10px;border-radius:999px;font-size:13px;background:var(--nane);white-space:nowrap}
.etiket.u{background:var(--nar);color:#fff}
.hata{color:var(--nar);font-weight:600}
.arac{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
@media(max-width:700px){.panel{grid-template-columns:minmax(0,1fr)}.menu{display:flex;flex-wrap:wrap}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="zibin" viewBox="0 0 100 110"><path d="M30 8 8 24l10 20 12-7v42q0 20 20 24 20-4 20-24V37l12 7 10-20L70 8q-20 16-40 0Z" fill="#17454f" opacity=".85"/></symbol>
</svg>

<header class="ust">
  <h1>Sayfa taslakları</h1>
  <p>Yerleşim ve görsel yön için hazırlandı. Ürünler, kişiler ve fiyatlar uydurmadır; düğmeler çalışmaz. Çizimlerin yerini gerçek ürün fotoğrafları alacak.</p>
</header>

<section class="grup">

      <div class="ic"><div class="ara">Ürün ara</div>
        <div><span class="cip">Yenidoğan</span><span class="cip">Bebek</span><span class="cip">Çocuk</span><span class="cip">Takım</span><span class="cip">Pijama</span></div>
        <h3>Yeni gelenler</h3>
        <div class="izgara"><div><div class="foto b"><svg viewBox="0 0 100 110"><use href="#zibin"/></svg></div><div class="ad">Müslin zıbın</div><div class="fiyat">₺249,90</div></div><div><div class="foto c"><svg viewBox="0 0 100 110"><use href="#zibin"/></svg></div><div class="ad">Örgü hırka</div><div class="fiyat">₺399,90</div></div></div>
      </div>
    </div>
  </figure>

  <figure><figcaption>Ürün listesi</figcaption>
    <div class="ekran">
      <div class="bar"><span>Geri</span><span class="logo">Zıbın</span><span>Sepet (2)</span></div>

          <div><div class="foto b"><svg viewBox="0 0 100 110"><use href="#zibin"/></svg></div><div class="ad">Müslin zıbın</div><div class="fiyat">₺199,90 <span class="eski">₺249,90</span></div></div>
          <div><div class="foto d"><svg viewBox="0 0 100 110"><use href="#zibin"/></svg></div><div class="ad">Çıtçıtlı zıbın</div><div class="fiyat">₺219,90</div></div>
          <div><div class="foto c"><svg viewBox="0 0 100 110"><use href="#zibin"/></svg></div><div class="ad">Çizgili zıbın</div><div class="fiyat">₺229,90</div></div>
        </div></div>
    </div>

  <figure><figcaption>Ürün detayı</figcaption>

  <figure><figcaption>Ödeme</figcaption>

        <span class="dugme tam">Siparişi onayla ve öde</span></div>

  </figure>

  <figure><figcaption>Sipariş takibi</figcaption>
    <div class="ekran">
      <div class="bar"><span>Geri</span><span class="logo">Siparişim</span><span></span></div>
      <div class="ic"><h3>AB-7K2M9Q</h3>

  <figure class="genis"><figcaption>Panel: toplu sipariş inceleme</figcaption>
